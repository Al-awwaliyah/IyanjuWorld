<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta
      name="description"
      content="IyanjuWorld is a modern multi-vendor marketplace connecting customers, businesses, and delivery riders. Discover products, shop securely, and get your orders delivered."
    />

    <meta
      name="keywords"
      content="IyanjuWorld, marketplace, online marketplace, Nigerian marketplace, Nigeria shopping, buy products online, local businesses, online stores, delivery, Nigerian businesses"
    />

    <meta name="author" content="Aremu Lawal" />

    <meta name="theme-color" content="#082A63" />

    <meta name="application-name" content="IyanjuWorld" />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta name="googlebot" content="index, follow" />

    <link rel="canonical" href="https://iyanjuworld.vercel.app/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />
    <meta
      name="apple-mobile-web-app-title"
      content="IyanjuWorld"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IyanjuWorld" />
    <meta property="og:title" content="IyanjuWorld — Discover. Buy. Deliver." />
    <meta
      property="og:description"
      content="Discover products from businesses on IyanjuWorld. Shop securely and get your orders delivered."
    />
    <meta property="og:url" content="https://iyanjuworld.vercel.app/" />
    <meta property="og:locale" content="en_NG" />
    <meta property="og:image" content="https://iyanjuworld.vercel.app/og-image.png" />
    <meta
      property="og:image:alt"
      content="IyanjuWorld marketplace"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="IyanjuWorld — Discover. Buy. Deliver."
    />
    <meta
      name="twitter:description"
      content="Discover products, shop from local businesses, and get your orders delivered with IyanjuWorld."
    />
    <meta
      name="twitter:image"
      content="https://iyanjuworld.vercel.app/og-image.png"
    />
    <meta
      name="twitter:image:alt"
      content="IyanjuWorld marketplace"
    />

    <title>IyanjuWorld — Discover. Buy. Deliver.</title>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to use IyanjuWorld.
    </noscript>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
